<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Songs A-Z</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:14px;
font-family:Arial,sans-serif;
background:#000;
color:#fff;
}

.app{
max-width:600px;
margin:auto;
}

h1{
font-size:22px;
margin:5px 0;
}

.sub{
color:#888;
font-size:13px;
margin-bottom:15px;
}

input,textarea,button{
width:100%;
padding:13px;
margin:5px 0;
border:0;
border-radius:9px;
font-size:15px;
}

input,textarea{
background:#222;
color:#fff;
outline:none;
}

textarea{
min-height:90px;
resize:vertical;
font-family:Arial,sans-serif;
}

button{
background:#1DB954;
color:#000;
font-weight:bold;
}

.secondary{
background:#222;
color:#fff;
}

.error{
color:#ff5555;
text-align:center;
min-height:20px;
}

.count{
color:#888;
font-size:13px;
margin:10px 2px;
}

.song{
background:#111;
padding:12px;
margin:7px 0;
border-radius:10px;
}

.title{
font-size:16px;
font-weight:bold;
}

.artist{
color:#aaa;
font-size:13px;
margin-top:3px;
}

.notes{
color:#ddd;
font-size:14px;
margin-top:9px;
white-space:pre-wrap;
}

.actions{
display:flex;
gap:6px;
margin-top:10px;
}

.actions button{
width:auto;
margin:0;
padding:8px 12px;
}

.edit{
background:#333;
color:#fff;
}

.delete{
background:#333;
color:#ff7777;
}

.empty{
text-align:center;
color:#666;
padding:30px;
}

#editor{
display:none;
background:#0d0d0d;
padding:12px;
border-radius:10px;
margin-bottom:12px;
}

#editor h2{
font-size:17px;
margin:2px 0 8px;
}
</style>
</head>

<body>

<div class="app">

<h1>🎵 Songs A-Z</h1>

<div class="sub">
My personal offline song notebook
</div>

<div id="editor">

<h2 id="editorTitle">Add Song</h2>

<input id="song" placeholder="Song title">

<input id="artist" placeholder="Artist">

<textarea id="notes"
placeholder="Add your words, thoughts, memories, or notes..."></textarea>

<button onclick="saveSong()">💾 SAVE</button>

<button class="secondary" onclick="cancelEdit()">CANCEL</button>

<p id="error" class="error"></p>

</div>

<button onclick="openNew()">+ ADD SONG</button>

<input
id="search"
placeholder="🔍 Search songs, artists or notes"
oninput="showSongs()">

<div id="count" class="count"></div>

<div id="list"></div>

</div>

<script>

let songs =
JSON.parse(localStorage.getItem("songsAZ") || "[]");

let editingIndex = -1;


function saveData(){

localStorage.setItem(
"songsAZ",
JSON.stringify(songs)
);

}


function openNew(){

editingIndex = -1;

document.getElementById("editorTitle").textContent =
"Add Song";

document.getElementById("song").value = "";

document.getElementById("artist").value = "";

document.getElementById("notes").value = "";

document.getElementById("error").textContent = "";

document.getElementById("editor").style.display =
"block";

window.scrollTo(0,0);

}


function editSong(index){

editingIndex = index;

let song = songs[index];

document.getElementById("editorTitle").textContent =
"Edit Song";

document.getElementById("song").value =
song.title;

document.getElementById("artist").value =
song.artist;

document.getElementById("notes").value =
song.notes || "";

document.getElementById("error").textContent = "";

document.getElementById("editor").style.display =
"block";

window.scrollTo(0,0);

}


function cancelEdit(){

document.getElementById("editor").style.display =
"none";

editingIndex = -1;

}


function saveSong(){

let title =
document.getElementById("song").value.trim();

let artist =
document.getElementById("artist").value.trim();

let notes =
document.getElementById("notes").value.trim();

let error =
document.getElementById("error");


if(!title || !artist){

error.textContent =
"Please enter both song title and artist.";

return;

}


let duplicate =
songs.some(function(song,index){

if(index === editingIndex) return false;

return song.title.toLowerCase() === title.toLowerCase()
&&
song.artist.toLowerCase() === artist.toLowerCase();

});


if(duplicate){

error.textContent =
"This song is already in your notebook.";

return;

}


if(editingIndex === -1){

songs.push({

title:title,
artist:artist,
notes:notes

});

}else{

songs[editingIndex].title = title;

songs[editingIndex].artist = artist;

songs[editingIndex].notes = notes;

}


saveData();

cancelEdit();

showSongs();

}


function deleteSong(index){

if(confirm("Delete this song?")){

songs.splice(index,1);

saveData();

showSongs();

}

}


function showSongs(){

let query =
document.getElementById("search").value
.toLowerCase()
.trim();

let list =
document.getElementById("list");

list.innerHTML = "";


let filtered =
songs.filter(function(song){

return song.title.toLowerCase().includes(query)
||
song.artist.toLowerCase().includes(query)
||
(song.notes || "").toLowerCase().includes(query);

});


filtered.sort(function(a,b){

return a.title.localeCompare(
b.title,
undefined,
{sensitivity:"base"}
);

});


document.getElementById("count").textContent =
filtered.length +
(filtered.length === 1 ? " song" : " songs");


if(filtered.length === 0){

list.innerHTML =
'<div class="empty">' +
(songs.length === 0
? "Your song notebook is empty."
: "No matching songs.") +
'</div>';

return;

}


filtered.forEach(function(song){

let index =
songs.indexOf(song);

let row =
document.createElement("div");

row.className = "song";


let title =
document.createElement("div");

title.className = "title";

title.textContent =
song.title;


let artist =
document.createElement("div");

artist.className = "artist";

artist.textContent =
song.artist;


row.appendChild(title);

row.appendChild(artist);


if(song.notes){

let notes =
document.createElement("div");

notes.className = "notes";

notes.textContent =
song.notes;

row.appendChild(notes);

}


let actions =
document.createElement("div");

actions.className = "actions";


let edit =
document.createElement("button");

edit.className = "edit";

edit.textContent = "✏️ Edit";

edit.onclick = function(){

editSong(index);

};


let del =
document.createElement("button");

del.className = "delete";

del.textContent = "🗑️ Delete";

del.onclick = function(){

deleteSong(index);

};


actions.appendChild(edit);

actions.appendChild(del);

row.appendChild(actions);

list.appendChild(row);

});

}


showSongs();


if("serviceWorker" in navigator){

window.addEventListener("load",function(){

navigator.serviceWorker.register(
"service-worker.js"
);

});

}

</script>

</body>
</html>
